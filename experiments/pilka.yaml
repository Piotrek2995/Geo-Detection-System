# Walidacja: pilka na dachu (docs/eksperyment_pilka.md).
# Przygotowanie: scripts/prepare_odm.py --config config_pilka.yaml -> ODM -> scripts/pilka_detect.py
#                -> (reczna korekta data/pilka_pixels.csv) -> scripts/pilka_reference.py
# Uruchomienie:  python scripts/run_experiment.py experiments/pilka.yaml
name: pilka
description: >
  Pozycja pilki (srednica ok. 22 cm) lezacej na dachu budynku wyznaczona z 19 zdjec lotu
  15.11.2026 (11-25 m nad startem), porownana z punktem odniesienia (Google Maps, GT_transfer).
  Osie: powierzchnia ray castingu (NMT, NMPT, DSM ODM) x kalibracja wysokosci (start_point,
  dem_alignment) x zrodlo piksela (detekcja yolo26l COCO, najlepszy detektor otwartego slownika
  "detection_best" = YOLOE-26l z promptem wizualnym, punkt reczny). Dla DSM ODM z_offset nie
  wplywa na polozenie poziome trafienia (porownanie wysokosci w ukladzie ODM), wiec wariant
  DSM ODM x dem_alignment jest pominiety. Warianty "7p": georeferencja rekonstrukcji wyrownana
  transformacja przestrzennego podobienstwa do NMPT GUGiK (geodetect/align.py).
base_config: ../config_pilka.yaml
overrides:
  aggregate.eps_m: 3.0
axes:
  surface.source: [nmt_local, nmpt_local, odm_dsm]
  z_anchor.mode: [start_point, dem_alignment]
  detect.source: [model, csv, manual]   # yolo26l COCO | najlepszy detektor (YOLOE wizualny) | recznie
exclude:
  - {surface.source: odm_dsm, z_anchor.mode: dem_alignment}
# Zadanie 3b: wyrownanie 7p do NMPT (georef.mode=similarity_nmpt), piksel reczny. z_anchor
# start_point sluzy tylko jako start (tz); "bez baro" — wysokosci barometryczne kamer tylko jako
# diagnostyka (prior wylaczony: model ODM tego lotu jest splaszczony w pionie, czego
# podobienstwo nie opisze — patrz docs/eksperyment_pilka.md, sekcja "po wyrownaniu").
variants:
  - {name: "nmt_local | 7p | manual", set: {surface.source: nmt_local, georef.mode: similarity_nmpt, detect.source: manual}}
  - {name: "nmpt_local | 7p | manual", set: {surface.source: nmpt_local, georef.mode: similarity_nmpt, detect.source: manual}}
  - {name: "odm_dsm | 7p | manual", set: {surface.source: odm_dsm, georef.mode: similarity_nmpt, detect.source: manual}}
  - {name: "nmt_local | 7p bez baro | manual", set: {surface.source: nmt_local, georef.mode: similarity_nmpt, georef.use_baro_prior: false, detect.source: manual}}
  - {name: "nmpt_local | 7p bez baro | manual", set: {surface.source: nmpt_local, georef.mode: similarity_nmpt, georef.use_baro_prior: false, detect.source: manual}}
  - {name: "odm_dsm | 7p bez baro | manual", set: {surface.source: odm_dsm, georef.mode: similarity_nmpt, georef.use_baro_prior: false, detect.source: manual}}
reference: "nmpt_local | start_point | manual"
metrics:
  static_classes: [sports ball]
  moving_classes: []
  min_views_static: 2
  min_views_scan: 3
  reference_point:
    latlon: [53.823837121662634, 21.435315268494285]
    cls: sports ball
    object_height_m: 0.11
    profiles: 3
    preview_h: null           # H pilki do rzutu na zdjecia w pilka_detect.py --project-gt (null: NMPT)
    reference_json: output/pilka/reference/reference.json
    ortho_pairs_csv: data/pilka_ortho_pairs.csv    # scripts/pilka_click.py --ortho (GT_transfer)
    # Trzy warianty GT (applies_to): "GT pilki" = odczyt z Google Maps; "GT pilki skorygowany" =
    # ten odczyt minus przesuniecie dachu zmierzone na ortofotomapie GUGiK; "GT_transfer" = pilka
    # z ortofotomapy ODM przeniesiona na GUGiK Helmertem z punktow dachu, minus przesuniecie dachu.
    uncertainty:
      - component: georeferencja zdjecia satelitarnego Google Maps
        applies_to: GT pilki
        sigma_m: 1.5
        note: >-
          GT wskazany na Google Maps (pilki nie ma na zadnym zdjeciu; wskazane miejsce na dachu);
          bezwzgledna dokladnosc zobrazowan Google na terenach wiejskich typowo 1-3 m
      - component: przesuniecie dachu wzgledem podstawy na zdjeciu Google (nieznane)
        applies_to: GT pilki
        sigma_m: 1.4
        note: >-
          wielkosc jak zmierzona na ortofotomapie GUGiK (1.4 m); kierunek na zdjeciu Google nieznany
      - component: precyzja wskazania miejsca na dachu
        applies_to: GT pilki
        sigma_m: 0.3
        note: pilka niewidoczna na zdjeciu Google; wskazanie wzgledem elementow dachu
      - component: GT Google (jak wyzej, laczna)
        applies_to: GT pilki skorygowany
        sigma_m: 1.5
        note: >-
          korekta o lean zmierzony na ortofotomapie GUGiK zaklada, ze zdjecie Google ma ten sam
          lean — nie musi; korekta ma charakter porownawczy
      - component: wyznaczenie przesuniecia dachu (dopasowanie obrysu EGiB do dachu)
        applies_to: GT pilki skorygowany
        sigma_m: 0.3
        note: roznica oszacowan budynek z GT / wszystkie budynki w kadrze
      - component: polozenie obrysu budynku EGiB
        applies_to: GT_transfer
        sigma_m: 0.3
        note: >-
          lean mierzony wzgledem obrysu EGiB; blad obrysu przenosi sie wprost na korekte
      - component: wyznaczenie przesuniecia dachu (dopasowanie obrysu EGiB do dachu)
        applies_to: GT_transfer
        sigma_m: 0.3
        note: jak wyzej
      - component: georeferencja ortofotomapy GUGiK
        applies_to: GT_transfer
        sigma_m: 0.2
        note: >-
          piksel 0.1 m; blad sredni polozenia NMT/NMPT z tego samego nalotu 0.09 m — przyjeto 0.2 m
      - component: transformacja Helmerta ODM -> GUGiK (RMS reszt)
        applies_to: GT_transfer
        sigma_m: null
        from: helmert_rms
        note: >-
          wskazania odpowiadajacych sobie punktow dachu na obu ortofotomapach; z 2 par brak
          nadmiarowosci (RMS nieokreslony) — wtedy przyjac 0.2 m
      - component: wskazanie pilki na ortofotomapie ODM
        applies_to: GT_transfer
        sigma_m: 0.05
        note: piksel 0.05 m (podglad), pilka 0.22 m
      - component: GPS telefonu (srednia z 5 pomiarow)
        applies_to: start
        sigma_m: 1.5
        note: >-
          typowy rozrzut GNSS smartfona 2-5 m, srednia z 5 skorelowanych pomiarow i kontrola
          na zdjeciu; wplyw na z_offset przez NMT(start) — patrz roznica telefon/EXIF
      - component: precyzja barometru (kontrola na zdjeciu startowym)
        applies_to: z_offset start_point
        sigma_m: 0.4
        note: >-
          zdjecie startowe EXIF 1.4 m przy deklarowanym ok. 1 m nad gruntem; dodatkowo MAD
          roznicy h_ODM - alt_EXIF po kamerach (raport kalibracji)
