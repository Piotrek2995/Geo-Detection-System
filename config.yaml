# Geo-Detection-System — przykladowa konfiguracja.
# Sciezki wzgledne liczone sa od katalogu, w ktorym lezy ten plik.

photos_dir: zdjecia
odm_dir: odm_project          # wynik OpenDroneMap (opensfm/reconstruction.json, reference_lla.json)
model_path: models/MODEL5.pt     # modele: folder models/ (LudzieiNamioty.pt — starszy, v4)
output_dir: output

# Jedno zdjecie (string) albo lista
images:
  - SING0304.JPG
  - SING0316.JPG

dem:
  source: gugik               # gugik | raster
  raster_path: null           # np. nmt/nmt_2180.tif (dla source: raster), EPSG:2180
  gugik_url: https://services.gugik.gov.pl/nmt/
  timeout_s: 10.0
  cache_path: output/cache/gugik_nmt.json   # cache probek GUGiK na dysku (null = tylko w pamieci)

# Detekcja YOLO. Klasy zawsze po NAZWIE z model.names (nieznana nazwa -> blad z lista
# dostepnych). Porownanie modeli i wariantow: experiments/detect.yaml (docs/experiments.md).
# MODEL5 bez kafli: kafle nie pomagaja (skala obiektow w kaflu inna niz w treningu),
# zostaja jako opcja (tiling.enabled / tiling.classes) dla modeli trenowanych na wycinkach.
detect:
  conf: 0.25
  # Progi z rozkladu conf TP/FP (experiments/detect.yaml): ludzie nisko (prawdziwa lezaca
  # osoba miala 0.31), namioty wyzej — FP w krzakach 0.38-0.58, TP obu modeli >= 0.68.
  # Dach domu (FP namiot, conf 0.74-0.84) nie da sie odciac progiem bez ryzyka dla TP.
  conf_per_class:
    namiot: 0.6
    people: 0.25
  classes: all                # all | lista nazw, np. [namiot, people]
  display_names:              # nazwy na mapie / w eksporcie
    namiot: namiot
    people: człowiek
  colors:                     # kolory klas na mapie (hex)
    namiot: "#2a78d6"
    people: "#eb6834"
  iou: 0.7                    # NMS
  imgsz: null                 # null = z treningu modelu (LudzieiNamioty.pt: 1024)
  device: auto                # auto | cuda | cuda:0 | cpu
  half: true                  # fp16 (tylko GPU; na CPU ignorowane przez ultralytics)
  max_det: 300
  batch: 8
  tiling:
    enabled: false
    classes: [people]         # klasy z kafli; pozostale tylko z pelnego obrazu
    tile_size: null           # null = imgsz
    overlap: 0.2
    include_full: true        # + pelny obraz przeskalowany (duze obiekty)
    edge_margin_px: 3.0
    nms_iou: 0.5
    contain_ios: 0.6

# Ray casting: marsz po promieniu + bisekcja na PIERWSZYM przecieciu z powierzchnia.
# Krok: step_m dla REST (brak rozdzielczosci); dla rastrow min(step_m,
# rozdzielczosc * raster_step_factor) — zeby nie przeskoczyc cienkiej przeszkody.
raycast:
  step_m: 5.0
  raster_step_factor: 1.0
  t_min_m: 0.5
  t_max_m: 800.0
  bisect_iters: 25
  chunk: 64                   # punkty promienia probkowane wsadowo (rastry)
  rest_chunk: 8               # j.w. dla REST GUGiK (1 zapytanie GetHByPointList na paczke)

# Powierzchnia, na ktora rzutujemy promienie (patrz README, "Zrodla powierzchni"):
#   nmt_gugik_rest — NMT 1 m z REST GUGiK (grunt, npm), bez pobierania plikow,
#   nmt_local      — arkusze NMT z geoportalu w nmt_dir (GeoTIFF/ASC/XYZ, mozaika, npm),
#   nmpt_local     — arkusze NMPT (pokrycie: drzewa, dachy) w nmpt_dir (REST nie ma NMPT),
#   odm_dsm        — DSM z ODM (EPSG:32634, wysokosci ODM -> porownanie BEZ z_offset).
# Kalibracja Z (z_anchor) jest liczona zawsze wzgledem NMT z sekcji `dem`, niezaleznie
# od tej sekcji (decyzja metodyczna — README).
surface:
  source: nmt_gugik_rest
  nmt_dir: data/nmt
  nmpt_dir: data/nmpt
  odm_dsm: null               # null = odm_project/odm_dem/dsm.tif
  interpolation: bilinear     # bilinear | nearest
  default_crs: EPSG:2180      # dla ASC bez .prj i XYZ (arkusze GUGiK: PUWG 1992)
  area_buffer_m: 300.0        # mozaika przycinana do bbox kamer + bufor

# Punkt reprezentatywny detekcji — przez ktory piksel idzie promien (README, "Punkt
# reprezentatywny"). Metody: bbox_center | bbox_bottom_center | mask_centroid |
# mask_ground_contact | mask_footprint_median; mask_* uzywaja SAM (prompt = bbox YOLO).
# per_class nadpisuje method dla klasy. Maska odrzucona -> bbox_center (adnotacja w wynikach).
point:
  # Domyslnie (wyniki experiments/point.yaml): namioty bbox_center — najmniejszy rozrzut
  # bez SAM; ludzie bbox_bottom_center — stopy to punkt na gruncie, a srodek bboxa stojacej
  # osoby jest ~0.9 m nad nim (przesuniecie ~0.75 m wzdluz promienia).
  method: bbox_center
  per_class:
    people: bbox_bottom_center
  sam_model: models/sam2.1_b.pt            # lzejszy: mobile_sam.pt (pobierane automatycznie)
  sam_device: null                  # null = GPU jesli dostepne
  mask_cache_dir: output/cache/masks
  min_area_ratio: 0.10              # maska / bbox ponizej -> too_small
  max_area_ratio: 0.97              # powyzej i dotyka wszystkich krawedzi bboxa -> fills_bbox
  min_largest_frac: 0.60            # najwieksza skladowa / maska ponizej -> fragmented
  edge_tol_px: 2.0
  min_offnadir_deg: 5.0             # ground_contact: blizej nadiru -> fallback mask_centroid
  contact_band: 0.05
  footprint_samples: 200
  seed: 0

# Filtry pojedynczych detekcji. Odrzucone zostaja w detections.geojson z polem
# rejected_reason, ale nie wchodza do agregacji. null / false = filtr wylaczony.
filters:
  border_margin_px: 2.0       # bbox blizej krawedzi kadru niz tyle px -> touches_border
  exclude_border: false       # odrzucac obiekty uciete krawedzia kadru
  max_range_m: null           # np. 150
  max_incidence_deg: null     # np. 65 (kat promienia od pionu)

# Agregacja wielowidokowa (DBSCAN w EPSG:2180, osobno dla kazdej klasy)
aggregate:
  # Uwaga: przy min_samples=1 rozrzut w klastrze jest ograniczony przez eps (laczenie
  # pojedyncze). Na locie testowym z z_anchor.mode=agl_assumption bledy miedzy przelotami
  # siegaja 5-10 m i eps=2.5 dzieli jeden namiot na kilka obiektow; po kalibracji
  # dem_alignment glowny namiot (26 widokow) miesci sie w eps=2.5 (RMS 1.2 m).
  eps_m: 2.5
  min_samples: 1              # 1 = obiekt widziany na jednym zdjeciu tez jest obiektem
  min_views: 2                # >= min_views widokow -> confirmed, inaczej single_view
  weights: equal              # equal | conf | cos_incidence

# Ocena detekcji wzgledem etykiet (experiments/detect.yaml). Eksport Roboflow v7
# (train/valid/test). MODEL5 trenowano na tym eksporcie -> zdjecia ze splitu train sa
# raportowane osobno (wyciek), valid+test to zbior uczciwy.
eval:
  labels_dir: C:/Users/pc/PycharmProjects/PYTORCH/28sierpniaMODEL5
  train_images: [SING0303.JPG, SING0304.JPG, SING0305.JPG, SING0306.JPG, SING0315.JPG,
                 SING0316.JPG, SING0317.JPG, SING0318.JPG, SING0321.JPG, SING0324.JPG,
                 SING0325.JPG, SING0326.JPG, SING0328.JPG, SING0329.JPG]
  leaky_models: [MODEL5.pt]   # modele trenowane na tym eksporcie (dla innych wszystko jest uczciwe)
  iou: 0.5
  thresholds: [0.25, 0.5]

# Kalibracja wysokosci: H [m npm] = h_ODM + z_offset. Potensic zapisuje GPS Altitude jako
# AGL od punktu startu, wiec wysokosci w ODM (kamery, chmura, DEM ODM) nie sa npm.
z_anchor:
  # agl_assumption — z_offset = NMT(mediana xy kamer) + agl_m - srednia h kamer
  #                  (fallback; wymaga zgadniecia wysokosci lotu)
  # ground_frame   — pierwsze zdjecie zrobione NA ZIEMI w punkcie startu (`image`):
  #                  z_offset = NMT(xy anchora) + lens_height_m - h anchora w ODM
  # dem_alignment  — DEM z ODM (odm_dem/dtm.tif, dsm.tif) dopasowany do NMT:
  #                  z_offset = mediana(NMT - DEM_ODM) w otwartym terenie
  # (multiview_check to tylko diagnostyka: experiments/zcal.yaml)
  mode: dem_alignment
  agl_m: 45.0
  # ground_frame
  image: null                 # np. SING0001.JPG
  lens_height_m: 0.15
  # dem_alignment (ODM musi wygenerowac DEM: --dtm --dsm, patrz ODM.md; tymczasowo mozna
  # wskazac wstepny DEM z chmury: output/cache/odm_pc_dtm.tif / odm_pc_dsm.tif,
  # generowany przez scripts/pointcloud_to_dem.py)
  odm_dtm: null               # null = odm_project/odm_dem/dtm.tif
  odm_dsm: null               # null = odm_project/odm_dem/dsm.tif
  n_samples: 300
  buffer_m: 10.0              # min. odleglosc probek od krawedzi DEM ODM
  max_dsm_dtm_m: 0.5          # przy obu DEM-ach: tylko punkty z DSM-DTM < 0.5 m
  apply_tilt: false           # true = korygowac tez dopasowana plaszczyzne (przechyl EO z ODM)
  seed: 0
