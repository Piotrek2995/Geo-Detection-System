# Geo-Detection-System — przykladowa konfiguracja.
# Sciezki wzgledne liczone sa od katalogu, w ktorym lezy ten plik.

photos_dir: zdjecia
odm_dir: odm_project          # wynik OpenDroneMap (opensfm/reconstruction.json, reference_lla.json)
model_path: LudzieiNamioty.pt
output_dir: output

# Jedno zdjecie (string) albo lista
images:
  - SING0304.JPG
  - SING0316.JPG

# Zalozona wysokosc lotu nad terenem [m] (kalibracja Z; Potensic zapisuje AGL od startu)
agl_fallback_m: 45.0

dem:
  source: gugik               # gugik | raster
  raster_path: null           # np. nmt/nmt_2180.tif (dla source: raster), EPSG:2180
  gugik_url: https://services.gugik.gov.pl/nmt/
  timeout_s: 10.0

detect:
  conf: 0.25
  classes: null               # null = wszystkie; np. [namiot, people]
  device: null                # null = auto; np. "0" (GPU) lub "cpu"

raycast:
  step_m: 5.0
  t_min_m: 0.5
  t_max_m: 800.0
  bisect_iters: 25

# Filtry pojedynczych detekcji. Odrzucone zostaja w detections.geojson z polem
# rejected_reason, ale nie wchodza do agregacji. null / false = filtr wylaczony.
filters:
  border_margin_px: 2.0       # bbox blizej krawedzi kadru niz tyle px -> touches_border
  exclude_border: false       # odrzucac obiekty uciete krawedzia kadru
  max_range_m: null           # np. 150
  max_incidence_deg: null     # np. 65 (kat promienia od pionu)

# Agregacja wielowidokowa (DBSCAN w EPSG:2180, osobno dla kazdej klasy)
aggregate:
  # Uwaga: przy min_samples=1 rozrzut w klastrze jest ograniczony przez eps (laczenie
  # pojedyncze). Na locie testowym bledy miedzy przelotami siegaja 5-10 m (zalozenie AGL),
  # wiec eps=2.5 dzieli jeden namiot na kilka obiektow; eps=10 daje stabilny podzial.
  eps_m: 2.5
  min_samples: 1              # 1 = obiekt widziany na jednym zdjeciu tez jest obiektem
  weights: equal              # equal | conf | cos_incidence
