# Preset GUI: Ludzie i namioty (MODEL5) (ustawienia detekcji)
model_path: models/MODEL5.pt
detect:
  conf: 0.25
  conf_per_class:
    namiot: 0.6
    people: 0.25
  classes: all
  display_names:
    namiot: namiot
    people: człowiek
  colors:
    namiot: '#2a78d6'
    people: '#eb6834'
  iou: 0.7
  imgsz: null
  device: auto
  half: true
  max_det: 300
  batch: 8
  top_k_per_class: null
  tiling:
    enabled: false
    classes:
    - people
    tile_size: null
    overlap: 0.2
    include_full: true
    edge_margin_px: 3.0
    nms_iou: 0.5
    contain_ios: 0.6
  source: model
  manual_csv: null
  detections_csv: null
  manual_class: manual
  manual_box_px: 6.0
  prompt_text: null
  visual_prompt_image: null
  visual_prompt_boxes: null
  visual_prompt_classes: null
point:
  method: bbox_center
  per_class:
    people: bbox_bottom_center
  sam_model: models/sam2.1_b.pt
  sam_device: null
  mask_cache_dir: output/cache/masks
  min_area_ratio: 0.1
  max_area_ratio: 0.97
  min_largest_frac: 0.6
  edge_tol_px: 2.0
  min_offnadir_deg: 5.0
  contact_band: 0.05
  footprint_samples: 200
  seed: 0
size:
  enabled: true
  ranges_m:
    namiot:
    - 1.5
    - 6.0
    people:
    - 0.3
    - 2.5
  min_cos_incidence: 0.3
  exclude_border: true
